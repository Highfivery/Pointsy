name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Version (Changesets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - run: npm ci

      # Opens/updates a "Version Packages" PR that applies pending changesets,
      # bumps the version, and updates CHANGELOG.md. Merging it cuts a release.
      # (No npm publish — Pointsy is a deployed app, not a package.)
      # v2 renamed every input we pass (version → version-script, commit →
      # commit-message, title → pr-title) and dropped support for the
      # GITHUB_TOKEN env var — the token must come in through `github-token`.
      - name: Create release pull request
        uses: changesets/action@v2
        with:
          version-script: npm run version
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          github-token: ${{ secrets.GITHUB_TOKEN }}
